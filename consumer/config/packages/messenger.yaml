framework:
    messenger:
        transports:
            # Custom queue/exchange created by the Laravel producer (not the default ones)
            orders:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Messenger\OrderCreatedSerializer
                options:
                    exchange:
                        name: orders.exchange
                        type: topic
                    queues:
                        orders.created.queue:
                            binding_keys: ['order.created']
                retry_strategy:
                    max_retries: 0   # no redelivery loop; failed messages are rejected
