parameters:
    env(ORDERS_CONSUME_BATCH_SIZE): '10'
    env(ORDERS_CONSUME_INTERVAL): '10'
    # Messages consumed per cycle
    app.orders.batch_size: '%env(int:ORDERS_CONSUME_BATCH_SIZE)%'
    # Seconds to wait between cycles
    app.orders.consume_interval: '%env(int:ORDERS_CONSUME_INTERVAL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # Custom consumer: pulls ONE message from the `orders` transport, then sleeps
    App\Command\ConsumeOrdersCommand:
        arguments:
            $receiver: '@messenger.transport.orders'
            $batchSize: '%app.orders.batch_size%'
            $interval: '%app.orders.consume_interval%'
